directories:
  output: dist
  buildResources: electron/build
appId: com.autoservicio.miestrella.desktop
productName: AUTOSERVICIO MI ESTRELLA
artifactName: AUTOSERVICIO MI ESTRELLA Setup v1.0.5.exe
icon: logo.ico
asar: false
files:
  - filter:
      - electron/**
      - Config/**
      - Assets/**
      - Controllers/**
      - Helpers/**
      - Libraries/**
      - Models/**
      - Views/**
      - php/**
      - database/**
      - '!database/*.db'
      - '!database/*.db.*'
      - '!database/installer/**'
      - autoload.php
      - favicon.ico
      - logo.ico
      - index.php
      - package.json
      - tmp/**
      - '!dist{,/**}'
      - '!npm-cache-temp{,/**}'
      - '!electron/build/app_icon.ico'
      - '!**/*.md'
      - '!**/*.log'
      - '!**/.git{,/**}'
extraResources:
  - from: php
    to: php
    filter:
      - '**/*'
  - from: installer/database.db
    to: database/database.db
    filter:
      - database.db
win:
  target:
    - nsis
  icon: logo.ico
  legalTrademarks: AUTOSERVICIO MI ESTRELLA
  signAndEditExecutable: true
nsis:
  installerIcon: logo.ico
  uninstallerIcon: logo.ico
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AUTOSERVICIO MI ESTRELLA
  include: electron/installer.nsh
electronVersion: 26.6.10
